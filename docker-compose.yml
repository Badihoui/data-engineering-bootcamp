# Lancement de la plateforme sur n'importe quel poste :
#
#     docker compose up --build        puis  http://localhost:8000
#
# Un seul service : Django sert l'API et le frontend construit. La base SQLite
# vit dans un volume nommé, elle survit donc à `docker compose down`.
#
# Variante PostgreSQL (inutile en local, prévue pour la suite) :
#     docker compose --profile postgres up --build

name: bootcamp-de

services:
  app:
    build:
      context: .
      dockerfile: platform-app/Dockerfile
    image: bootcamp-de:latest
    ports:
      - '${PORT:-8000}:8000'
    environment:
      # Clé de développement. À remplacer par une valeur générée dès que
      # l'application est exposée ailleurs que sur localhost.
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-docker-local-insecure-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,app}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      # Pas de TLS en local : sans cela, Django redirigerait vers https et
      # rendrait l'application inaccessible.
      DJANGO_SSL_REDIRECT: '0'
      # Frontend et API partagent l'origine : CORS sans objet.
      CORS_ALLOWED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      SQLITE_PATH: /data/db.sqlite3
      # Renseigner ces deux variables crée un compte admin au premier démarrage.
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      # Mettre à 1 pour réimporter les notebooks au prochain démarrage.
      BOOTCAMP_REIMPORT: ${BOOTCAMP_REIMPORT:-0}
    volumes:
      - bootcamp-data:/data
    restart: unless-stopped

  # ------------------------------------------------------------- PostgreSQL
  # Activé seulement avec `--profile postgres`.
  postgres:
    profiles: ['postgres']
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bootcamp
      POSTGRES_USER: bootcamp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bootcamp}
    volumes:
      - bootcamp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bootcamp -d bootcamp']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  bootcamp-data:
  bootcamp-postgres:
